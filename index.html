<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090909">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vanguard Counter">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Vanguard Counter</title>
<style>
:root{color-scheme:dark;--bg:#090909;--panel:#171717;--panel2:#202020;--red:#c51e2b;--gold:#d8ad55;--muted:#aaa;--line:#38312a}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#261012 0,#090909 48%);color:#f7f2e8;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;padding:env(safe-area-inset-top) 14px calc(18px + env(safe-area-inset-bottom))}
header{max-width:760px;margin:0 auto;padding:22px 2px 14px;display:flex;align-items:center;justify-content:space-between}
.brand{font-weight:900;letter-spacing:.08em;font-size:20px}.brand span{color:var(--gold)}.sub{font-size:10px;letter-spacing:.22em;color:var(--muted);margin-top:4px}
.pill{border:1px solid #735b2e;color:var(--gold);border-radius:99px;padding:6px 10px;font-size:11px}
main{max-width:760px;margin:auto}.totals{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 14px}
.total{background:linear-gradient(145deg,#211719,#151515);border:1px solid var(--line);border-radius:15px;padding:13px}.total small{color:var(--muted)}.total strong{display:block;font-size:30px;color:var(--gold);margin-top:3px;font-variant-numeric:tabular-nums}
.switch{display:grid;grid-template-columns:1fr 1fr;background:#111;border:1px solid var(--line);padding:4px;border-radius:13px;margin-bottom:15px}
.switch button{border:0;background:transparent;color:#aaa;padding:12px;border-radius:10px;font-size:15px;font-weight:800}.switch button.active{background:var(--red);color:white;box-shadow:0 3px 14px #8f101b66}
.toolbar{display:flex;gap:8px;margin:10px 0 15px}.toolbar input{min-width:0;flex:1;background:#151515;border:1px solid var(--line);border-radius:10px;color:white;padding:11px;font-size:14px}
.filters{display:flex;gap:7px;overflow:auto;margin-bottom:14px}.filters button,.action{white-space:nowrap;border:1px solid var(--line);background:#171717;color:#ddd;border-radius:10px;padding:9px 12px;font-weight:700}.filters button.active{border-color:var(--gold);color:var(--gold);background:#241e13}
.section{margin:16px 0}.section h2{font-size:13px;letter-spacing:.12em;color:var(--gold);margin:0 0 9px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.item{background:linear-gradient(150deg,#1c1c1c,#121212);border:1px solid #38312a;border-radius:13px;padding:11px;min-width:0}
.item-name{font-weight:750;font-size:14px;min-height:20px}.count{text-align:center;font-size:29px;font-weight:900;color:#fff;padding:8px 0;font-variant-numeric:tabular-nums}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px}.controls button{height:42px;border-radius:10px;font-size:21px;font-weight:900;border:1px solid #594b3b;background:#24201b;color:var(--gold)}.controls button.plus{background:linear-gradient(135deg,#b51c2a,#79121b);border-color:#d7474e;color:white}
.bottom{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:18px 0 8px}.action{padding:12px}.action.primary{background:#9e1823;border-color:#d33b45;color:white}.action.gold{border-color:#8b6d34;color:var(--gold)}
.history{background:#141414;border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:14px}.history-head{display:flex;justify-content:space-between;align-items:center;font-weight:800}.history-list{font-size:12px;color:#ccc;max-height:120px;overflow:auto;margin-top:8px}.history-list div{padding:5px 0;border-top:1px solid #292929}
.note{color:#888;font-size:11px;line-height:1.6;margin:12px 2px}.toast{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#292018;border:1px solid var(--gold);color:#f7e4b7;padding:10px 16px;border-radius:99px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.item{padding:14px}.count{font-size:34px}}
</style>
</head>
<body>
<header><div><div class="brand">VANGUARD <span>COUNTER</span></div><div class="sub">TRIGGER & TAROT TRACKER</div></div><div class="pill">FIGHT TOOL</div></header>
<main>
 <div class="totals">
  <div class="total"><small>自分の合計</small><strong id="myTotal">0</strong></div>
  <div class="total"><small>相手の合計</small><strong id="opTotal">0</strong></div>
 </div>
 <div class="switch"><button id="myTab" class="active">自分</button><button id="opTab">相手</button></div>
 <div class="toolbar"><input id="search" type="search" placeholder="項目を検索"><button class="action gold" id="undo">↶ 取り消し</button></div>
 <div class="filters"><button class="active" data-filter="all">すべて</button><button data-filter="trigger">トリガー</button><button data-filter="tarot">タロット</button></div>
 <div id="items"></div>
 <div class="bottom"><button class="action primary" id="newFight">⚔ 新しいファイト</button><button class="action" id="finish">ファイト終了</button></div>
 <div class="history"><div class="history-head"><span>操作履歴</span><span id="historyCount" style="color:var(--gold)">0件</span></div><div class="history-list" id="history"></div></div>
 <p class="note">数値はこのiPhone内に自動保存されます。Safariでホーム画面に追加すると、アプリのように起動できます。ファイト終了では現在の数値を保持し、新しいファイトで両プレイヤーの数値を0に戻します。</p>
</main><div class="toast" id="toast"></div>
<script>
const groups=[
 {id:"trigger",title:"TRIGGERS / トリガー",items:["☆トリガー","治トリガー","引トリガー","前トリガー","超トリガー"]},
 {id:"tarot",title:"TAROT / タロットカード",items:["愚者","魔術師","女教皇","女帝","皇帝","法王","恋愛","戦車","正義","隠者","運命","剛毅","刑死者","死神","節制","悪魔","塔","星","月","太陽","審判","世界"]}
];
const names=groups.flatMap(g=>g.items);
const fresh=()=>Object.fromEntries(names.map(n=>[n,0]));
const defaultState=()=>({counts:{自分:fresh(),相手:fresh()},player:"自分",history:[],status:"待機中"});
let state=load();
function load(){try{const s=JSON.parse(localStorage.getItem("vc-state"));if(s&&s.counts&&s.counts.自分&&s.counts.相手)return s}catch(e){}return defaultState()}
function save(){localStorage.setItem("vc-state",JSON.stringify(state))}
let filter="all";
const $=id=>document.getElementById(id);
function total(p){return Object.values(state.counts[p]).reduce((a,b)=>a+b,0)}
function render(){
 $("myTotal").textContent=total("自分");$("opTotal").textContent=total("相手");
 $("myTab").classList.toggle("active",state.player==="自分");$("opTab").classList.toggle("active",state.player==="相手");
 const q=$("search").value.trim();const root=$("items");root.innerHTML="";
 groups.filter(g=>filter==="all"||filter===g.id).forEach(g=>{
  const items=g.items.filter(n=>n.includes(q));if(!items.length)return;
  const section=document.createElement("section");section.className="section";
  const h=document.createElement("h2");h.textContent=g.title;section.append(h);
  const grid=document.createElement("div");grid.className="grid";
  items.forEach(name=>{
   const card=document.createElement("div");card.className="item";
   const title=document.createElement("div");title.className="item-name";title.textContent=name;
   const count=document.createElement("div");count.className="count";count.textContent=state.counts[state.player][name];
   const controls=document.createElement("div");controls.className="controls";
   const minus=document.createElement("button");minus.textContent="−";minus.setAttribute("aria-label",name+"を1減らす");minus.onclick=()=>change(name,-1);
   const plus=document.createElement("button");plus.className="plus";plus.textContent="＋";plus.setAttribute("aria-label",name+"を1増やす");plus.onclick=()=>change(name,1);
   controls.append(minus,plus);card.append(title,count,controls);grid.append(card);
  });section.append(grid);root.append(section);
 });
 $("historyCount").textContent=state.history.length+"件";
 $("history").innerHTML="";
 state.history.slice().reverse().slice(0,8).forEach(x=>{const row=document.createElement("div");row.textContent=x.player+"："+x.name+" "+(x.delta>0?"+1":"−1");$("history").append(row)});
 $("undo").disabled=!state.history.length;$("undo").style.opacity=state.history.length?1:.45;
}
function change(name,delta){
 const before=JSON.parse(JSON.stringify(state.counts));
 const v=state.counts[state.player][name]+delta;if(v<0){toast("0未満にはできません");return}
 state.history.push({before,player:state.player,name,delta});if(state.history.length>100)state.history.shift();
 state.counts[state.player][name]=v;save();render();
}
function undo(){const x=state.history.pop();if(!x)return;state.counts=x.before;state.player=x.player;save();render();toast("直前の操作を取り消しました")}
function toast(msg){const t=$("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1700)}
$("myTab").onclick=()=>{state.player="自分";save();render()};
$("opTab").onclick=()=>{state.player="相手";save();render()};
$("undo").onclick=undo;
$("search").oninput=render;
document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll("[data-filter]").forEach(x=>x.classList.toggle("active",x===b));render()});
$("newFight").onclick=()=>{if(confirm("自分・相手の全カウントと履歴をリセットして、新しいファイトを開始しますか？")){state.counts={自分:fresh(),相手:fresh()};state.history=[];state.player="自分";state.status="ファイト中";save();render();toast("新しいファイトを開始しました")}};
$("finish").onclick=()=>{state.status="終了";save();toast("ファイト終了。数値は保存されています")};
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
render();
</script>
</body></html>
