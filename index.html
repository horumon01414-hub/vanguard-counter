<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#090909">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Vanguard Counter">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Vanguard Counter</title>
<style>
:root{color-scheme:dark;--bg:#090909;--panel:#171717;--panel2:#202020;--red:#c51e2b;--gold:#d8ad55;--muted:#aaa;--line:#38312a}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at top,#261012 0,#090909 48%);color:#f7f2e8;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN",Meiryo,sans-serif;padding:env(safe-area-inset-top) 14px calc(18px + env(safe-area-inset-bottom))}
header{max-width:760px;margin:0 auto;padding:22px 2px 14px;display:flex;align-items:center;justify-content:space-between}
.brand{font-weight:900;letter-spacing:.08em;font-size:20px}.brand span{color:var(--gold)}.sub{font-size:10px;letter-spacing:.22em;color:var(--muted);margin-top:4px}
.pill{border:1px solid #735b2e;color:var(--gold);border-radius:99px;padding:6px 10px;font-size:11px}
main{max-width:760px;margin:auto}.totals{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:8px 0 14px}
.total{background:linear-gradient(145deg,#211719,#151515);border:1px solid var(--line);border-radius:15px;padding:13px}.total small{color:var(--muted)}.total strong{display:block;font-size:30px;color:var(--gold);margin-top:3px;font-variant-numeric:tabular-nums}
.main-tabs{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:10px 0 14px}.main-tabs button{padding:12px;border-radius:11px;border:1px solid var(--line);background:#171717;color:#aaa;font-weight:800}.main-tabs button.active{background:#2a2116;border-color:var(--gold);color:var(--gold)}
.panel-hidden{display:none!important}.match-card{border-top:1px solid #292929;padding:12px 0}.match-card-head{display:flex;justify-content:space-between;align-items:center;gap:8px}.match-card-title{font-weight:800;color:#f5e8c9}.match-meta{font-size:12px;color:#bbb;margin-top:6px;line-height:1.6}.match-delete{border:1px solid #73313a;background:#291316;color:#ff9da4;border-radius:8px;padding:7px 10px}.match-memo{font-size:12px;color:#d1c6b1;white-space:pre-wrap;margin-top:7px;line-height:1.6}.field{display:block;margin:12px 0}.field span{display:block;font-size:12px;color:var(--gold);margin-bottom:6px}.field input,.field textarea{width:100%;background:#101010;border:1px solid var(--line);border-radius:9px;color:white;padding:11px;font:inherit}.field textarea{min-height:76px;resize:vertical}
.switch{display:grid;grid-template-columns:1fr 1fr;background:#111;border:1px solid var(--line);padding:4px;border-radius:13px;margin-bottom:15px}
.switch button{border:0;background:transparent;color:#aaa;padding:12px;border-radius:10px;font-size:15px;font-weight:800}.switch button.active{background:var(--red);color:white;box-shadow:0 3px 14px #8f101b66}
.toolbar{display:flex;gap:8px;margin:10px 0 15px}.toolbar input{min-width:0;flex:1;background:#151515;border:1px solid var(--line);border-radius:10px;color:white;padding:11px;font-size:14px}
.filters{display:flex;gap:7px;overflow:auto;margin-bottom:14px}.filters button,.action{white-space:nowrap;border:1px solid var(--line);background:#171717;color:#ddd;border-radius:10px;padding:9px 12px;font-weight:700}.filters button.active{border-color:var(--gold);color:var(--gold);background:#241e13}
.section{margin:16px 0}.section h2{font-size:13px;letter-spacing:.12em;color:var(--gold);margin:0 0 9px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:9px}
.item{background:linear-gradient(150deg,#1c1c1c,#121212);border:1px solid #38312a;border-radius:13px;padding:11px;min-width:0}.item.tarot-maxed{border:2px solid var(--gold);box-shadow:0 0 0 1px #d8ad5544,0 0 13px #d8ad5533}.item.tarot-maxed .count{color:var(--gold)}.controls button:disabled{opacity:.35;cursor:not-allowed}
.item-name{font-weight:750;font-size:14px;min-height:20px}.count{text-align:center;font-size:29px;font-weight:900;color:#fff;padding:8px 0;font-variant-numeric:tabular-nums}
.controls{display:grid;grid-template-columns:1fr 1fr;gap:8px}.controls button{height:42px;border-radius:10px;font-size:21px;font-weight:900;border:1px solid #594b3b;background:#24201b;color:var(--gold)}.controls button.plus{background:linear-gradient(135deg,#b51c2a,#79121b);border-color:#d7474e;color:white}
.bottom{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:18px 0 8px}.action{padding:12px}.action.primary{background:#9e1823;border-color:#d33b45;color:white}.action.gold{border-color:#8b6d34;color:var(--gold)}
.history{background:#141414;border:1px solid var(--line);border-radius:12px;padding:12px;margin-top:14px}.history-head{display:flex;justify-content:space-between;align-items:center;font-weight:800}.history-list{font-size:12px;color:#ccc;max-height:120px;overflow:auto;margin-top:8px}.history-list div{padding:5px 0;border-top:1px solid #292929}
.match-tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.match-list{font-size:12px;color:#ccc;max-height:220px;overflow:auto;margin-top:8px}.match-row{padding:9px 0;border-top:1px solid #292929;display:flex;justify-content:space-between;gap:8px}.result-dialog{position:fixed;inset:0;background:#000b;display:none;align-items:center;justify-content:center;padding:20px;z-index:10}.result-dialog.open{display:flex}.dialog-card{width:min(100%,420px);background:#171717;border:1px solid #8b6d34;border-radius:16px;padding:18px}.dialog-card h3{margin:0 0 12px;color:var(--gold)}.result-buttons{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.result-buttons button{padding:12px 4px;border-radius:9px;border:1px solid var(--line);background:#24201b;color:#fff;font-weight:800}.dialog-cancel{margin-top:12px;width:100%;padding:10px;border:1px solid var(--line);border-radius:9px;background:#222;color:#ddd}.note{color:#888;font-size:11px;line-height:1.6;margin:12px 2px}.toast{position:fixed;bottom:calc(22px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);background:#292018;border:1px solid var(--gold);color:#f7e4b7;padding:10px 16px;border-radius:99px;opacity:0;pointer-events:none;transition:.2s}.toast.show{opacity:1}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}.item{padding:14px}.count{font-size:34px}}
</style>
</head>
<body>
<header><div><div class="brand">VANGUARD <span>COUNTER</span></div><div class="sub">TRIGGER & TAROT TRACKER</div></div><div class="pill">FIGHT TOOL</div></header>
<main>
 <div class="main-tabs"><button id="counterPage" class="active">カウント</button><button id="recordsPage">対戦記録</button></div>
 <div id="counterPanel">
 <div class="totals">
  <div class="total"><small>自分の合計</small><strong id="myTotal">0</strong></div>
  <div class="total"><small>相手の合計</small><strong id="opTotal">0</strong></div>
 </div>
 <div class="switch"><button id="myTab" class="active">自分</button><button id="opTab">相手</button></div>
 <div class="toolbar"><input id="search" type="search" placeholder="項目を検索"><button class="action gold" id="undo">↶ 取り消し</button></div>
 <div class="filters"><button class="active" data-filter="all">すべて</button><button data-filter="trigger">トリガー</button><button data-filter="tarot">タロット</button></div>
 <div id="items"></div>
 <div class="bottom"><button class="action primary" id="newFight">⚔ 新しいファイト</button><button class="action" id="finish">ファイト終了</button></div>
 <div class="history"><div class="history-head"><span>操作履歴</span><span id="historyCount" style="color:var(--gold)">0件</span></div><div class="history-list" id="history"></div></div>
 </div>
 <div id="recordsPanel" class="panel-hidden"><div class="history"><div class="history-head"><span>対戦記録</span><span id="matchCount" style="color:var(--gold)">0戦</span></div><div class="match-list" id="matchList">まだ対戦記録はありません</div><div class="match-tools"><button class="action gold" id="exportCsv">CSVを書き出す</button></div></div><p class="note">対戦記録はこのiPhone内に保存されます。削除した記録は元に戻せません。</p></div>
 <p class="note" id="counterNote">数値はこのiPhone内に自動保存されます。Safariでホーム画面に追加すると、アプリのように起動できます。ファイト終了では現在の数値を保持し、新しいファイトで両プレイヤーの数値を0に戻します。</p>
</main><div class="result-dialog" id="resultDialog"><div class="dialog-card"><h3>対戦結果を記録</h3><p>自分から見た今回の結果を選択してください。</p><label class="field"><span>対戦相手のデッキタイトル</span><input id="opponentDeck" placeholder="例：○○デッキ"></label><label class="field"><span>敗因・反省点</span><textarea id="lossReason" placeholder="例：序盤の展開が遅れた"></textarea></label><label class="field"><span>その他のメモ</span><textarea id="matchNote" placeholder="自由にメモを入力"></textarea></label><div class="result-buttons"><button data-result="勝ち">勝ち</button><button data-result="負け">負け</button><button data-result="引き分け">引き分け</button></div><button class="dialog-cancel" id="cancelResult">キャンセル</button></div></div><div class="toast" id="toast"></div>
<script>
const groups=[
 {id:"trigger",title:"TRIGGERS / トリガー",items:["☆トリガー","治トリガー","引トリガー","前トリガー","超トリガー"]},
 {id:"tarot",title:"TAROT / タロットカード",items:["愚者","魔術師","女教皇","女帝","皇帝","法王","恋愛","戦車","正義","隠者","運命","剛毅","刑死者","死神","節制","悪魔","塔","星","月","太陽","審判","世界"]}
];
const names=groups.flatMap(g=>g.items),fresh=()=>Object.fromEntries(names.map(n=>[n,0]));
const defaultState=()=>({counts:{自分:fresh(),相手:fresh()},player:"自分",history:[],status:"待機中",matches:[]});
function load(){try{const s=JSON.parse(localStorage.getItem("vc-state"));if(s&&s.counts&&s.counts.自分&&s.counts.相手){s.matches=Array.isArray(s.matches)?s.matches:[];s.matches.forEach((m,i)=>{if(!m.id)m.id="legacy-"+i+"-"+String(m.date||"")});s.history=Array.isArray(s.history)?s.history:[];for(const p of ["自分","相手"])for(const n of names)if(typeof s.counts[p][n]!=="number")s.counts[p][n]=0;return s}}catch(e){}return defaultState()}
let state=load(),filter="all";const $=id=>document.getElementById(id);
function save(){localStorage.setItem("vc-state",JSON.stringify(state))}
function total(p){return Object.values(state.counts[p]).reduce((a,b)=>a+b,0)}
function triggerTotal(p){return groups[0].items.reduce((a,n)=>a+state.counts[p][n],0)}
function toast(msg){const t=$("toast");t.textContent=msg;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),1700)}
function render(){
 $("myTotal").textContent=total("自分");$("opTotal").textContent=total("相手");
 $("myTab").classList.toggle("active",state.player==="自分");$("opTab").classList.toggle("active",state.player==="相手");
 const q=$("search").value.trim(),root=$("items");root.innerHTML="";
 groups.filter(g=>filter==="all"||filter===g.id).forEach(g=>{
  let items=g.items.filter(n=>n.includes(q));if(g.id==="tarot")items.sort((a,b)=>state.counts[state.player][b]-state.counts[state.player][a]||g.items.indexOf(a)-g.items.indexOf(b));if(!items.length)return;
  const section=document.createElement("section");section.className="section";const h=document.createElement("h2");h.textContent=g.title+(g.id==="trigger"?` / 合計 ${triggerTotal(state.player)}`:" / 多い順");section.append(h);const grid=document.createElement("div");grid.className="grid";
  items.forEach(name=>{const card=document.createElement("div");const current=state.counts[state.player][name];card.className="item"+(g.id==="tarot"&&current===3?" tarot-maxed":"");const title=document.createElement("div");title.className="item-name";title.textContent=name;const count=document.createElement("div");count.className="count";count.textContent=current;const controls=document.createElement("div");controls.className="controls";const minus=document.createElement("button");minus.textContent="−";minus.setAttribute("aria-label",name+"を1減らす");minus.onclick=()=>change(name,-1);const plus=document.createElement("button");plus.className="plus";plus.textContent="＋";plus.setAttribute("aria-label",name+"を1増やす");plus.onclick=()=>change(name,1);if(g.id==="tarot"&&current>=3){plus.disabled=true;plus.title="タロットの上限は3です"}controls.append(minus,plus);card.append(title,count,controls);grid.append(card)});section.append(grid);root.append(section);
 });
 $("historyCount").textContent=state.history.length+"件";$("history").innerHTML="";state.history.slice().reverse().slice(0,8).forEach(x=>{const row=document.createElement("div");row.textContent=x.player+"："+x.name+" "+(x.delta>0?"+1":"−1");$("history").append(row)});$("undo").disabled=!state.history.length;$("undo").style.opacity=state.history.length?1:.45;
 $("matchCount").textContent=state.matches.length+"戦";const ml=$("matchList");ml.innerHTML="";if(!state.matches.length)ml.textContent="まだ対戦記録はありません";state.matches.slice().reverse().forEach(m=>{const card=document.createElement("div");card.className="match-card";const head=document.createElement("div");head.className="match-card-head";const title=document.createElement("div");title.className="match-card-title";title.textContent=m.date+"　"+m.result;const del=document.createElement("button");del.className="match-delete";del.textContent="削除";del.onclick=()=>{if(confirm("この対戦記録を削除しますか？削除後は元に戻せません。")){state.matches=state.matches.filter(x=>x.id!==m.id);save();render();toast("対戦記録を削除しました")}};head.append(title,del);const meta=document.createElement("div");meta.className="match-meta";meta.textContent=`相手デッキ：${m.opponentDeck||"未入力"}\n自分 ${m.myTotal} / 相手 ${m.opTotal}（トリガー ${m.myTriggers} : ${m.opTriggers}）`;card.append(head,meta);if(m.lossReason||m.note){const memo=document.createElement("div");memo.className="match-memo";memo.textContent=(m.lossReason?"敗因・反省点："+m.lossReason+"\n":"")+(m.note?"メモ："+m.note:"");card.append(memo)}ml.append(card)});
}
function change(name,delta){const before=JSON.parse(JSON.stringify(state.counts)),v=state.counts[state.player][name]+delta;const isTarot=groups.find(g=>g.id==="tarot").items.includes(name);if(isTarot&&v>3){toast("タロットの上限は3です");return}if(v<0){toast("0未満にはできません");return}state.history.push({before,player:state.player,name,delta});if(state.history.length>100)state.history.shift();state.counts[state.player][name]=v;save();render()}
function undo(){const x=state.history.pop();if(!x)return;state.counts=x.before;state.player=x.player;save();render();toast("直前の操作を取り消しました")}
$("myTab").onclick=()=>{state.player="自分";save();render()};$("opTab").onclick=()=>{state.player="相手";save();render()};$("undo").onclick=undo;$("search").oninput=render;
document.querySelectorAll("[data-filter]").forEach(b=>b.onclick=()=>{filter=b.dataset.filter;document.querySelectorAll("[data-filter]").forEach(x=>x.classList.toggle("active",x===b));render()});
$("newFight").onclick=()=>{if(confirm("自分・相手の全カウントと操作履歴をリセットして、新しいファイトを開始しますか？（対戦記録は残ります）")){state.counts={自分:fresh(),相手:fresh()};state.history=[];state.player="自分";state.status="ファイト中";save();render();toast("新しいファイトを開始しました")}};
$("finish").onclick=()=>$("resultDialog").classList.add("open");$("cancelResult").onclick=()=>$("resultDialog").classList.remove("open");
document.querySelectorAll("[data-result]").forEach(b=>b.onclick=()=>{const date=new Date().toLocaleString("ja-JP");state.matches.push({id:(crypto.randomUUID?crypto.randomUUID():String(Date.now())+Math.random()),date,result:b.dataset.result,opponentDeck:$("opponentDeck").value.trim(),lossReason:$("lossReason").value.trim(),note:$("matchNote").value.trim(),myTotal:total("自分"),opTotal:total("相手"),myTriggers:triggerTotal("自分"),opTriggers:triggerTotal("相手"),counts:JSON.parse(JSON.stringify(state.counts))});state.status="終了";save();$("resultDialog").classList.remove("open");$("opponentDeck").value=$("lossReason").value=$("matchNote").value="";render();toast(b.dataset.result+"で対戦記録を保存しました")});
$("exportCsv").onclick=()=>{if(!state.matches.length){toast("出力できる対戦記録がありません");return}const header=["日時","結果","対戦相手デッキ","敗因・反省点","メモ","自分合計","相手合計","自分トリガー合計","相手トリガー合計",...names.map(n=>"自分_"+n),...names.map(n=>"相手_"+n)];const rows=state.matches.map(m=>[m.date,m.result,m.opponentDeck||"",m.lossReason||"",m.note||"",m.myTotal,m.opTotal,m.myTriggers,m.opTriggers,...names.map(n=>m.counts.自分[n]),...names.map(n=>m.counts.相手[n])]);const esc=v=>'"'+String(v??"").replace(/"/g,'""')+'"';const csv='\uFEFF'+[header,...rows].map(r=>r.map(esc).join(",")).join("\r\n");const blob=new Blob([csv],{type:"text/csv;charset=utf-8"}),url=URL.createObjectURL(blob),a=document.createElement("a");a.href=url;a.download="Vanguard_Counter_対戦記録.csv";a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);toast("CSVを書き出しました")};
$("counterPage").onclick=()=>{ $("counterPanel").classList.remove("panel-hidden");$("recordsPanel").classList.add("panel-hidden");$("counterPage").classList.add("active");$("recordsPage").classList.remove("active")};$("recordsPage").onclick=()=>{$("counterPanel").classList.add("panel-hidden");$("recordsPanel").classList.remove("panel-hidden");$("recordsPage").classList.add("active");$("counterPage").classList.remove("active")};
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));render();

</script>
</body></html>
